name: Build and Deploy Backend

on:
  push:
    branches:
      - backend # change si ta branche backend a un autre nom

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_IMAGE_NAME }} .

    - name: Save Docker image to archive
      run: docker save ${{ secrets.DOCKER_IMAGE_NAME }} | gzip > image.tar.gz

    - name: Copy image to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "image.tar.gz"
        target: "~/"

    - name: Load and run container on VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker load < image.tar.gz
          docker stop hackathon-backend || true
          docker rm hackathon-backend || true
          docker run -d --name hackathon-backend -p 5000:8080 ${{ secrets.DOCKER_IMAGE_NAME }}
